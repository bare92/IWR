[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iwr"
version = "0.1.0"
description = "Irrigation Water Requirement processing on gridded domains"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "IWR Team" }
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "xarray>=2024.1.0",
  "rioxarray>=0.17",
  "rasterio>=1.4",
  "geopandas>=1.0",
  "pyogrio>=0.10",
  "shapely>=2.0",
  "fiona>=1.10",
  "pyproj>=3.7",
  "rasterstats>=0.20",
  "dask[array,dataframe]>=2024.1.0",
  "netcdf4>=1.7",
  "h5netcdf>=1.3",
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "black>=24.8",
  "mypy>=1.11"
]

[tool.hatch.build.targets.wheel]
packages = ["src/iwr_processing"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
